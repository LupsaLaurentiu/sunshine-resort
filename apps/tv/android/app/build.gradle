plugins { id 'com.android.application' }

def tvPackage = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))

android {
    namespace 'com.sunshine.resort.tv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.sunshine.resort.tv'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "${tvPackage.version}-android.1"
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets { main { assets.srcDirs = ['../../dist-android'] } }
    buildTypes { release { minifyEnabled false } }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
